name: Upstream drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build drift report
        run: |
          git fetch https://github.com/craft-ai-agents/craft-agents-oss.git main:refs/remotes/upstream/main
          {
            echo "Pinned baseline: a60ebc1a5a7c"
            echo "Current upstream: $(git rev-parse refs/remotes/upstream/main)"
            echo
            git diff --stat a60ebc1a5a7c..refs/remotes/upstream/main
          } > upstream-drift.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const title = 'Scheduled upstream drift report'
            const body = '```text\n' + fs.readFileSync('upstream-drift.txt', 'utf8').slice(0, 60000) + '\n```'
            const { data } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift' })
            const existing = data.find(issue => issue.title === title)
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-drift'] })
