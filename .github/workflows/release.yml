name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
      APPLE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      PUBLIC_TOKEN: ${{ secrets.MKAGENT_PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Require stable-release credentials
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$WINDOWS_CERTIFICATE"
          test -n "$WINDOWS_PASSWORD"
          test -n "$PUBLIC_TOKEN"

  build:
    needs: credentials
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run electron:build
      - name: Package desktop
        working-directory: apps/electron
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: bunx electron-builder --config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Build headless server
        shell: bash
        run: bun run scripts/build-server.ts --output=dist/MkAgent-server-${{ runner.os }}-${{ matrix.arch }} --compress
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/electron/release/*
            dist/MkAgent-server-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.MKAGENT_PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo open-fox/mkagent-public --title "MkAgent $TAG" --notes "Signed MkAgent desktop, headless server, update manifests, blockmaps, and checksums."
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --repo open-fox/mkagent-public --clobber
