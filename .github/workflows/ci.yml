name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:all
      - run: bun run lint
      - run: bun run validate:ci
      - run: bun test

  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run electron:build
      - if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --mac dir --arm64
      - if: matrix.target == 'win'
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --win dir --x64
      - if: matrix.target == 'linux'
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --linux dir --x64
      - run: bun run scripts/build-server.ts --output=dist/headless-smoke
