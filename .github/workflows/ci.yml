name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Craft baseline
        run: |
          git clone --filter=blob:none https://github.com/craft-ai-agents/craft-agents-oss.git "$RUNNER_TEMP/craft-agents-oss"
          git -C "$RUNNER_TEMP/craft-agents-oss" checkout --detach a60ebc1a5a7cb0a6af7a77d5eed0512c5fc07658
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:all
      - run: bun run lint
        env:
          CRAFT_AGENT_SOURCE: ${{ runner.temp }}/craft-agents-oss
      - run: bun run audit:craft-reuse
        env:
          CRAFT_AGENT_SOURCE: ${{ runner.temp }}/craft-agents-oss
      - run: bun run validate:ci
      - run: bun run test
      - run: bun run webui:build
      - run: bun run cli:build
      - run: git diff --check

  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run electron:build
      - if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --mac --dir --arm64
      - if: matrix.target == 'win'
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --win --dir --x64
      - if: matrix.target == 'linux'
        run: cd apps/electron && bunx electron-builder --config electron-builder.yml --linux --dir --x64
      - run: bun run scripts/build-server.ts --output=dist/headless-smoke
