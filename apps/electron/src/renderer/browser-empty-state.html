<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* wss://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss://127.0.0.1:* wss:; font-src 'self' data: https://fonts.gstatic.com;">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500&display=swap" rel="stylesheet">
  <script>
    (() => {
      const media = window.matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = (mode) => {
        const normalized = mode === 'light' || mode === 'dark' ? mode : 'system'
        const resolved = normalized === 'system' ? (media.matches ? 'dark' : 'light') : normalized
        document.documentElement.dataset.themeMode = normalized
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(resolved)
      }
      window.__MKAGENT_APPLY_BROWSER_THEME__ = applyTheme
      media.addEventListener('change', () => {
        if (document.documentElement.dataset.themeMode === 'system') applyTheme('system')
      })
      applyTheme(new URLSearchParams(window.location.search).get('themeMode'))
    })()
  </script>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    html, body { background: #fafafb; }
    html.dark, html.dark body { background: #2b292e; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./browser-empty-state.tsx"></script>
</body>
</html>
